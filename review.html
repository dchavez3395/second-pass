<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Second Pass review</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #ffffff; --panel: #f6f7f9; --line: #dfe3e8; --text: #1f2328; --muted: #6b7280;
    --accent: #2563eb; --ok: #15803d; --bad: #b91c1c; --warn: #b45309; --okbg: #ecfdf3; --badbg: #fef2f2; --warnbg: #fffbeb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111316; --panel: #1a1d22; --line: #2b3038; --text: #e6e8eb; --muted: #9aa3ad;
      --accent: #60a5fa; --ok: #4ade80; --bad: #f87171; --warn: #fbbf24; --okbg: #12261a; --badbg: #2a1515; --warnbg: #2a2110;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111316; --panel: #1a1d22; --line: #2b3038; --text: #e6e8eb; --muted: #9aa3ad;
    --accent: #60a5fa; --ok: #4ade80; --bad: #f87171; --warn: #fbbf24; --okbg: #12261a; --badbg: #2a1515; --warnbg: #2a2110;
  }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; padding: 4px 9px; font-size: 12.5px; color: var(--muted); }
  .seg button.on { background: var(--accent); color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 10px; }
  .chips button { border-radius: 999px; padding: 3px 11px; font-size: 13px; }
  .chips button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .chips input { margin-left: auto; min-width: 220px; }
  .tag.impact-critical, .tag.impact-serious { color: var(--bad); border-color: var(--bad); }
  .tag.impact-moderate { color: var(--warn); border-color: var(--warn); }
  .ring { display: inline-block; width: 46px; height: 46px; border-radius: 50%; background: conic-gradient(var(--ok) calc(var(--p) * 1%), var(--line) 0); position: relative; float: right; }
  .ring::after { content: ''; position: absolute; inset: 7px; border-radius: 50%; background: var(--bg); }
  .stat.pt .n { color: var(--ok); }
  .sites td a { font-weight: 600; } .sites td { vertical-align: middle; }
  .sites .mini { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; display: flex; width: 120px; }
  .sites .mini i { display: block; height: 100%; background: var(--ok); }
  th.sortable { cursor: pointer; user-select: none; } th.sortable:hover { color: var(--text); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); }
  header { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  select, input[type=text], textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.ok { color: var(--ok); border-color: var(--ok); } button.bad { color: var(--bad); border-color: var(--bad); } button.warn { color: var(--warn); border-color: var(--warn); }
  button.sm { padding: 3px 9px; font-size: 13px; }
  .tabs { display: flex; gap: 4px; }
  .tabs button { border: none; background: none; padding: 6px 10px; border-bottom: 2px solid transparent; border-radius: 0; color: var(--muted); }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  main { max-width: 1100px; margin: 0 auto; padding: 18px 20px 60px; }

  /* summary */
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .stat .n { font-size: 26px; font-weight: 600; line-height: 1.1; }
  .stat .l { color: var(--muted); font-size: 12.5px; }
  .stat.ok .n { color: var(--ok); } .stat.bad .n { color: var(--bad); } .stat.warn .n { color: var(--warn); }
  .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; display: flex; margin: 6px 0 16px; }
  .bar i { display: block; height: 100%; } .bar .c { background: var(--bad); } .bar .i { background: var(--ok); } .bar .l { background: var(--warn); }

  /* issues table */
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr.issue { cursor: pointer; } tr.issue:hover td { background: var(--panel); }
  tr.issue td:first-child { width: 22px; color: var(--muted); }
  .title { font-weight: 600; }
  .sub { color: var(--muted); font-size: 12.5px; }
  .tag { display: inline-block; font-size: 11.5px; border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; color: var(--muted); margin-left: 6px; vertical-align: 1px; }
  .tag.fail { color: var(--bad); border-color: var(--bad); } .tag.open { color: var(--warn); border-color: var(--warn); }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); vertical-align: -1px; margin-right: 3px; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .num b.pass { color: var(--ok); } .num b.fail { color: var(--bad); }
  .st { white-space: nowrap; font-size: 13px; }
  .st .c { color: var(--bad); } .st .i { color: var(--ok); } .st .l { color: var(--warn); }
  .acts { white-space: nowrap; display: flex; gap: 6px; justify-content: flex-end; }

  /* instances */
  tr.detail td { background: var(--panel); padding: 8px 10px 14px 32px; }
  .why { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  .groupacts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .groupacts input { flex: 1; min-width: 200px; }
  .inst { display: grid; grid-template-columns: 150px 1fr auto; gap: 12px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin: 6px 0; }
  .inst.confirm { border-left: 4px solid var(--bad); } .inst.reject { border-left: 4px solid var(--ok); } .inst.look { border-left: 4px solid var(--warn); }
  .inst img { width: 150px; height: 60px; object-fit: contain; background: #fff; border-radius: 4px; border: 1px solid var(--line); display: block; }
  .inst .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .inst code { display: block; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .inst .m { font-size: 13px; }
  .inst .d { font-size: 12.5px; margin-top: 2px; } .inst .d.confirm { color: var(--bad); } .inst .d.reject { color: var(--ok); } .inst .d.look { color: var(--warn); }
  .inst .ai { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .inst .ai b.agree { color: var(--ok); } .inst .ai b.disagree { color: var(--bad); }
  .reasonrow { display: flex; gap: 6px; margin: 4px 0 0; } .reasonrow[hidden] { display: none; } .reasonrow input { flex: 1; }

  /* worksheet */
  .ws td.status select { min-width: 160px; }
  .ws textarea { width: 100%; min-height: 38px; }
  .ws .sug { font-size: 12px; color: var(--muted); }
  .ws .sug b { cursor: pointer; color: var(--accent); }

  /* view on page */
  .viewer { position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 20; display: none; flex-direction: column; }
  .viewer.show { display: flex; }
  .vbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 14px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .vbar .info { flex: 1; min-width: 200px; }
  .vbar .info b.pass { color: var(--ok); } .vbar .info b.fail { color: var(--bad); }
  .vbody { flex: 1; overflow: auto; position: relative; }
  .stage { position: relative; transform-origin: 0 0; margin: 0 auto; }
  .stage img { display: block; }
  .stage canvas { display: none; }
  .hl { position: absolute; border: 3px solid #ff2d55; box-shadow: 0 0 0 9999px rgba(0,0,0,.45); pointer-events: none; border-radius: 2px; }
  .ghost { position: absolute; border: 2px solid rgba(96,165,250,.9); cursor: pointer; }
  .ghost:hover { background: rgba(96,165,250,.2); }
  .mark { position: absolute; width: 14px; height: 14px; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 0 2px #000; transform: translate(-50%,-50%); pointer-events: none; }
  .vbody.dropper { cursor: crosshair; }
  .readout { position: sticky; top: 10px; margin: 10px; z-index: 3; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; display: none; width: max-content; max-width: 90%; }
  .readout.show { display: block; }
  .readout .big { font-size: 20px; font-weight: 600; } .readout .big.pass { color: var(--ok); } .readout .big.fail { color: var(--bad); }
  .flash { position: fixed; right: 16px; bottom: 16px; background: var(--text); color: var(--bg); padding: 8px 12px; border-radius: 6px; opacity: 0; transition: opacity .2s; z-index: 30; }
  .flash.show { opacity: 1; }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
  .help { color: var(--muted); font-size: 12.5px; margin: 14px 0 0; }
</style>
</head>
<body>
<header>
  <h1>Second Pass</h1>
  <select id="site"></select>
  <div class="tabs"><button class="on" data-tab="issues">Issues</button><button data-tab="worksheet">Worksheet</button></div>
  <span style="margin-left:auto"></span>
  <span class="seg" id="theme" title="Theme"><button data-theme="light">Light</button><button data-theme="system">Auto</button><button data-theme="dark">Dark</button></span>
  <button id="export">Export worksheet (.xlsx)</button>
</header>

<main>
  <div id="issues"></div>
  <div id="worksheet" hidden></div>
</main>

<div class="viewer" id="viewer">
  <div class="vbar">
    <button id="v-prev" title="previous (←)">◀</button><button id="v-next" title="next (→)">▶</button>
    <div class="info" id="v-info"></div>
    <button class="bad sm" id="v-confirm">Confirm</button>
    <button class="ok sm" id="v-ignore">Ignore</button>
    <button class="warn sm" id="v-look">Not sure</button>
    <button class="sm" id="v-drop" title="measure two points (E)">Eyedropper</button>
    <button class="sm" id="v-close" title="close (Esc)">Close ✕</button>
  </div>
  <div class="vbody" id="vbody"><div class="readout" id="readout"></div><div class="stage" id="stage"></div></div>
</div>
<div class="flash" id="flash"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const MODEL_TO_HUMAN = { fail: 'confirm', pass: 'reject', cannot_tell: 'look' };
const LABEL = { confirm: 'Confirmed', reject: 'Ignored', look: 'Not sure' };

let S = null, open = new Set(), tab = 'issues';
let V = { list: [], i: 0, dropper: false, a: null, scale: 1 };

// ---- data ---------------------------------------------------------------------

let SITES = [], filter = 'all', query = '', sortKey = null, sortDir = 1;

async function loadSites() {
  SITES = await (await fetch('/api/sites')).json();
  const sel = $('#site');
  const cur = sel.value;
  sel.innerHTML = `<option value="">All sites — overview</option>` + SITES.map((s) => `<option value="${esc(s.site)}">${esc(s.site)} — ${s.decided}/${s.findings} reviewed</option>`).join('');
  const want = cur || decodeURIComponent(location.hash.slice(1));
  sel.value = SITES.some((s) => s.site === want) ? want : '';
  if (sel.value) await loadSite(sel.value); else renderOverview();
}

function renderOverview() {
  S = null; location.hash = '';
  $('#worksheet').hidden = true; $('#issues').hidden = false; $('#export').disabled = true;
  const tot = SITES.reduce((a, s) => ({ findings: a.findings + s.findings, decided: a.decided + s.decided, failures: a.failures + s.failures, unsure: a.unsure + s.unsure, confirmed: a.confirmed + s.confirmed }), { findings: 0, decided: 0, failures: 0, unsure: 0, confirmed: 0 });
  const key = sortKey || 'findings';
  const rows = [...SITES].sort((a, b) => (typeof a[key] === 'string' ? a[key].localeCompare(b[key]) : (a[key] ?? 0) - (b[key] ?? 0)) * (sortKey ? sortDir : -1));
  let html = `<div class="summary">
    <div class="stat"><div class="n">${SITES.length}</div><div class="l">sites scanned</div></div>
    <div class="stat bad"><div class="n">${tot.failures}</div><div class="l">axe failures</div></div>
    <div class="stat warn"><div class="n">${tot.unsure}</div><div class="l">axe unsure — needs a person</div></div>
    <div class="stat"><div class="n">${tot.decided}</div><div class="l">of ${tot.findings} reviewed</div></div>
    <div class="stat bad"><div class="n">${tot.confirmed}</div><div class="l">confirmed real problems</div></div>
  </div>
  <table class="sites"><thead><tr>${[['site', 'Site'], ['passed', 'Passed tests'], ['failures', 'Failures'], ['unsure', 'Unsure'], ['findings', 'Flagged'], ['decided', 'Reviewed'], ['confirmed', 'Confirmed']].map(([k, l]) => `<th class="sortable" data-sort="${k}">${l}${sortKey === k ? (sortDir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('')}</tr></thead><tbody>`;
  for (const s of rows) {
    const pt = s.axe ? Math.round((100 * s.axe.passRules) / Math.max(1, s.axe.passRules + s.axe.violationRules + s.axe.incompleteRules)) : null;
    s.passed = pt ?? -1;
    html += `<tr><td><a href="#${esc(s.site)}" data-site="${esc(s.site)}">${esc(s.site)}</a><div class="sub">${esc(s.title || '')}${s.verdict && /NOT RENDER/.test(s.verdict) ? ' · <b>did not render</b>' : ''}</div></td>
      <td class="num">${pt != null ? `<b class="${pt >= 90 ? 'pass' : 'fail'}">${pt}%</b>` : '—'}</td>
      <td class="num">${s.failures || '<span class="sub">0</span>'}</td><td class="num">${s.unsure || '<span class="sub">0</span>'}</td><td class="num">${s.findings}</td>
      <td><div class="mini"><i style="width:${s.findings ? (100 * s.decided) / s.findings : 0}%"></i></div><div class="sub">${s.decided}/${s.findings}</div></td>
      <td class="num">${s.confirmed || '<span class="sub">0</span>'}</td></tr>`;
  }
  html += `</tbody></table><p class="help"><b>Passed tests</b> is axe's own view: rules passed as a share of rules it could apply. A high number says the page avoids the mistakes a machine can detect — nothing more. <b>Unsure</b> is the work.</p>`;
  $('#issues').innerHTML = html;
  $('#issues').querySelectorAll('[data-site]').forEach((a) => a.onclick = (e) => { e.preventDefault(); $('#site').value = a.dataset.site; open = new Set(); loadSite(a.dataset.site); });
  $('#issues').querySelectorAll('[data-sort]').forEach((h) => h.onclick = () => { if (sortKey === h.dataset.sort) sortDir = -sortDir; else { sortKey = h.dataset.sort; sortDir = h.dataset.sort === 'site' ? 1 : -1; } renderOverview(); });
}

async function loadSite(site) {
  $('#export').disabled = false;
  S = await (await fetch(`/api/site?site=${encodeURIComponent(site)}`)).json();
  S.byId = Object.fromEntries(S.findings.map((f) => [f.id, f]));
  S.groupById = Object.fromEntries(S.groups.map((g) => [g.id, g]));
  S.critById = Object.fromEntries(S.wcag.criteria.map((c) => [c.id, c]));
  location.hash = site;
  render();
}
const critName = (id) => (S.critById[id] ? `${S.critById[id].id} ${S.critById[id].name}` : id);
const dec = (id) => S.decisions[id];
function tally(ids) { const t = { confirm: 0, reject: 0, look: 0, todo: 0 }; for (const id of ids) t[dec(id) ? dec(id).verdict : 'todo']++; return t; }

// ---- issues tab ----------------------------------------------------------------

function render() {
  $('#issues').hidden = tab !== 'issues';
  $('#worksheet').hidden = tab !== 'worksheet';
  document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  tab === 'issues' ? renderIssues() : renderWorksheet();
}

function renderIssues() {
  const all = S.findings.map((f) => f.id);
  const t = tally(all);
  const pct = (n) => (all.length ? (100 * n) / all.length : 0);
  const ax = S.axe;
  const pt = ax ? Math.round((100 * ax.passRules) / Math.max(1, ax.passRules + ax.violationRules + ax.incompleteRules)) : null;
  let html = `<div class="summary">
    ${pt != null ? `<div class="stat pt"><span class="ring" style="--p:${pt}"></span><div class="n">${pt}%</div><div class="l">passed tests<br><span title="${ax.passRules} passed, ${ax.violationRules} failed, ${ax.incompleteRules} unsure, ${ax.inapplicableRules} not applicable">${ax.passRules} of ${ax.passRules + ax.violationRules + ax.incompleteRules} rules axe could apply</span></div></div>` : ''}
    <div class="stat"><div class="n">${all.length}</div><div class="l">items flagged on <a href="${esc(S.url)}" target="_blank" rel="noopener">${esc(S.site)}</a> in ${S.groups.length} issue${S.groups.length === 1 ? '' : 's'}</div></div>
    <div class="stat bad"><div class="n">${t.confirm}</div><div class="l">confirmed — real problems</div></div>
    <div class="stat ok"><div class="n">${t.reject}</div><div class="l">ignored — not a problem</div></div>
    <div class="stat warn"><div class="n">${t.look}</div><div class="l">not sure yet</div></div>
    <div class="stat"><div class="n">${t.todo}</div><div class="l">still to review</div></div>
  </div>
  <div class="bar"><i class="c" style="width:${pct(t.confirm)}%"></i><i class="i" style="width:${pct(t.reject)}%"></i><i class="l" style="width:${pct(t.look)}%"></i></div>`;

  // Issues sorted: axe failures first, then by count. Then the chips and the search box.
  const q = query.trim().toLowerCase();
  const matches = (g) => {
    const gt = tally(g.ids);
    if (filter === 'fail' && g.kind !== 'violation') return false;
    if (filter === 'unsure' && g.kind !== 'incomplete') return false;
    if (filter === 'todo' && !gt.todo) return false;
    if (filter === 'done' && gt.todo) return false;
    if (q && !`${g.help} ${g.label} ${g.rule} ${g.why} ${critName(g.criterion)}`.toLowerCase().includes(q)) return false;
    return true;
  };
  const groups = [...S.groups].sort((a, b) => (a.kind === b.kind ? b.ids.length - a.ids.length : a.kind === 'violation' ? -1 : 1)).filter(matches);
  const cnt = (f) => S.groups.filter((g) => { const keep = filter; filter = f; const m = matches(g); filter = keep; return m; }).length;
  html += `<div class="chips">${[['all', 'All'], ['fail', 'axe failures'], ['unsure', 'axe unsure'], ['todo', 'Not reviewed'], ['done', 'Reviewed']].map(([k, l]) => `<button class="${filter === k ? 'on' : ''}" data-filter="${k}">${l} <span class="sub">${cnt(k)}</span></button>`).join('')}<input type="text" id="q" placeholder="Search issues…" value="${esc(query)}"></div>`;
  html += `<table><thead><tr><th></th><th>Issue</th><th>Count</th><th>Measured</th><th>Status</th><th></th></tr></thead><tbody>`;
  for (const g of groups) {
    const gt = tally(g.ids);
    const sw = (g.label.match(/rgba?\([^)]*\)/g) || []).map((c) => `<span class="sw" style="background:${esc(c)}"></span>`).join('');
    const m = g.measured;
    const isOpen = open.has(g.id);
    html += `<tr class="issue" data-g="${esc(g.id)}">
      <td>${isOpen ? '▾' : '▸'}</td>
      <td><div class="title">${esc(g.help)}<span class="tag ${g.kind === 'violation' ? 'fail' : 'open'}">${g.kind === 'violation' ? 'axe: fail' : 'axe: unsure'}</span>${g.impact ? `<span class="tag impact-${esc(g.impact)}">${esc(g.impact)}</span>` : ''}<span class="tag">${esc(critName(g.criterion))}</span></div>
          <div class="sub">${sw}${esc(g.label)}</div></td>
      <td class="num">${g.ids.length}</td>
      <td class="num">${m ? `<b class="${m.worst >= m.threshold ? 'pass' : 'fail'}">${m.worst}:1</b>${m.best !== m.worst ? ` – ${m.best}:1` : ''}<div class="sub">needs ${m.threshold}:1${m.below ? ` · ${m.below} below` : ''}</div>` : '<span class="sub">—</span>'}</td>
      <td class="st">${gt.todo === g.ids.length ? '<span class="sub">not reviewed</span>' : `${gt.confirm ? `<span class="c">${gt.confirm} confirmed</span> ` : ''}${gt.reject ? `<span class="i">${gt.reject} ignored</span> ` : ''}${gt.look ? `<span class="l">${gt.look} not sure</span> ` : ''}${gt.todo ? `<span class="sub">${gt.todo} left</span>` : ''}`}</td>
      <td><div class="acts"><button class="sm" data-view="${esc(g.id)}">View on page</button><button class="sm" data-toggle="${esc(g.id)}">${isOpen ? 'Hide' : 'Details'}</button></div></td>
    </tr>`;
    if (isOpen) html += `<tr class="detail"><td colspan="6">${detailHtml(g)}</td></tr>`;
  }
  html += `</tbody></table>`;
  if (!groups.length) html += `<div class="empty">${S.groups.length ? 'Nothing matches that filter.' : 'Nothing flagged on this page.'}</div>`;
  html += `<p class="help"><b>Confirm</b> = a real accessibility problem. <b>Ignore</b> = the checker was wrong, and you say why. <b>Not sure</b> = come back to it. Do a whole issue at once, or open Details and go item by item. <b>View on page</b> walks through the items on the screenshot. The AI's opinion appears only after you've decided.</p>`;
  $('#issues').innerHTML = html;

  $('#issues').querySelectorAll('[data-filter]').forEach((b) => b.onclick = () => { filter = b.dataset.filter; renderIssues(); });
  const qi = $('#q'); qi.oninput = () => { query = qi.value; const pos = qi.selectionStart; renderIssues(); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); };
  $('#issues').querySelectorAll('tr.issue').forEach((r) => r.onclick = (e) => { if (e.target.tagName === 'BUTTON' || e.target.tagName === 'A') return; toggle(r.dataset.g); });
  $('#issues').querySelectorAll('[data-toggle]').forEach((b) => b.onclick = () => toggle(b.dataset.toggle));
  $('#issues').querySelectorAll('[data-view]').forEach((b) => b.onclick = () => openViewer(b.dataset.view));
  $('#issues').querySelectorAll('[data-gact]').forEach((b) => b.onclick = () => decide(S.groupById[b.dataset.g].ids.filter((id) => !dec(id)), b.dataset.gact, b.dataset.g));
  $('#issues').querySelectorAll('[data-greason]').forEach((i) => i.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); decide(S.groupById[i.dataset.greason].ids.filter((id) => !dec(id)), i.dataset.pending || 'confirm', i.dataset.greason, i.value); } });
  $('#issues').querySelectorAll('[data-iact]').forEach((b) => b.onclick = () => decide([b.dataset.id], b.dataset.iact, null, null, b.dataset.id));
  $('#issues').querySelectorAll('[data-ireason]').forEach((i) => i.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); decide([i.dataset.ireason], 'reject', null, i.value); } });
  $('#issues').querySelectorAll('[data-iview]').forEach((b) => b.onclick = () => openViewer(null, b.dataset.iview));
  $('#issues').querySelectorAll('[data-issue]').forEach((b) => b.onclick = () => { taskFormFor = b.dataset.issue; renderIssues(); const n = $('#tf-name'); if (n) n.focus(); });
  $('#issues').querySelectorAll('[data-deltask]').forEach((b) => b.onclick = () => saveTask({ id: b.dataset.deltask, site: S.site, deleted: true }));
  const tf = $('#issues').querySelector('[data-tf]');
  if (tf) {
    const g = S.groupById[tf.dataset.tf];
    $('#tf-save').onclick = () => saveTask({ site: S.site, criterion: g.criterion, group: g.id, severity: $('#tf-sev').value, shortname: $('#tf-name').value, notes: $('#tf-notes').value, reference: $('#tf-ref').value });
    $('#tf-cancel').onclick = () => { taskFormFor = null; renderIssues(); };
  }
}

function toggle(gid) { open.has(gid) ? open.delete(gid) : open.add(gid); renderIssues(); }

function detailHtml(g) {
  const gt = tally(g.ids);
  let html = `<p class="why">${esc(g.why)} <a href="${esc(g.helpUrl)}" target="_blank" rel="noopener">about this rule ↗</a></p>`;
  if (gt.todo) {
    html += `<div class="groupacts"><span class="sub">All ${gt.todo} remaining:</span>
      <button class="bad sm" data-gact="confirm" data-g="${esc(g.id)}">Confirm all</button>
      <button class="ok sm" data-gact="reject" data-g="${esc(g.id)}">Ignore all</button>
      <button class="warn sm" data-gact="look" data-g="${esc(g.id)}">Not sure</button>
      <input type="text" data-greason="${esc(g.id)}" placeholder="Reason (needed to ignore) — Enter saves">
    </div>`;
  } else {
    html += `<div class="groupacts"><span class="sub">All reviewed.</span> <button class="sm" data-gact="reopen" data-g="${esc(g.id)}">Undo all</button></div>`;
  }
  const logged = S.tasks.filter((t) => t.group === g.id);
  html += `<div class="groupacts" style="margin-top:4px"><span class="sub">Task list:</span> ${logged.length ? logged.map((t) => `<span class="tag">${esc(t.severity)} · ${esc(t.shortname.slice(0, 60))}</span><button class="sm" data-deltask="${esc(t.id)}">remove</button>`).join(' ') : '<span class="sub">confirmed items go in automatically at export;</span>'} <button class="sm" data-issue="${esc(g.id)}">Log an issue by hand</button></div>`;
  if (taskFormFor === g.id) html += taskFormHtml(g);
  for (const id of g.ids) html += instHtml(S.byId[id], g);
  return html;
}

let taskFormFor = null;
function taskFormHtml(g) {
  const m = g.measured;
  const notes = m ? `Measured ${m.worst}:1 at worst${m.best !== m.worst ? ` (${m.best}:1 at best)` : ''} against ${m.threshold}:1; ${m.below} of ${m.n} below. ${g.why}` : g.why;
  const sev = g.impact === 'critical' || g.impact === 'serious' ? 3 : g.impact === 'moderate' ? 2 : 1;
  return `<div class="groupacts" data-tf="${esc(g.id)}" style="display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px">
    <label class="sub">Severity</label><select id="tf-sev"><option value="3" ${sev === 3 ? 'selected' : ''}>3 — High</option><option value="2" ${sev === 2 ? 'selected' : ''}>2 — Medium</option><option value="1" ${sev === 1 ? 'selected' : ''}>1 — Low</option></select>
    <label class="sub">Issue</label><input type="text" id="tf-name" value="${esc(g.help)} — ${esc(g.label)}">
    <label class="sub">Notes</label><textarea id="tf-notes" style="width:100%;min-height:56px">${esc(notes)}</textarea>
    <label class="sub">Reference</label><input type="text" id="tf-ref" value="${esc(g.ids.map((id) => S.byId[id].target).join(' ; ').slice(0, 500))}">
    <span></span><span><button class="primary sm" id="tf-save">Add to task list</button> <button class="sm" id="tf-cancel">Cancel</button></span>
  </div>`;
}

async function saveTask(t) {
  const r = await post('/api/task', t);
  if (!r) return;
  taskFormFor = null;
  await loadSite(S.site);
  flash(t.deleted ? 'Removed from task list' : 'Added to task list');
}

function instHtml(f, g) {
  const d = dec(f.id), p = S.proposals[f.id], m = p && p.measured, b = f.box || {};
  const revealed = p && p.verdict;
  let ai = '';
  if (d && revealed) { const agree = MODEL_TO_HUMAN[p.verdict] === d.verdict; ai = `<div class="ai">AI said <b class="${agree ? 'agree' : 'disagree'}">${esc(p.verdict.replace('_', ' '))}</b>${p.confidence != null ? ` (${p.confidence})` : ''} — ${esc(p.reason)}</div>`; }
  return `<div class="inst ${d ? esc(d.verdict) : ''}" data-id="${esc(f.id)}">
    <div>${f.crop ? `<img src="/crops/${encodeURIComponent(f.crop)}" alt="">` : '<div class="sub">no crop</div>'}</div>
    <div>
      <div class="t">${esc(b.text || f.html.replace(/<[^>]+>/g, ' ').trim() || f.target)}</div>
      <code title="${esc(f.html)}">${esc(f.html)}</code>
      ${m && m.ok && m.fg ? `<div class="m num"><b class="${m.ratio >= m.threshold ? 'pass' : 'fail'}">${m.ratio}:1</b>${m.best && m.best !== m.ratio ? ` – ${m.best}:1` : ''} <span class="sub">needs ${m.threshold}:1${m.note ? ' · ' + esc(m.note) : ''}</span></div>` : ''}
      ${d ? `<div class="d ${esc(d.verdict)}">${LABEL[d.verdict]}${d.reason ? ' — ' + esc(d.reason) : ''}</div>` : ''}
      ${ai}
      ${!d ? `<div class="reasonrow" hidden><input type="text" data-ireason="${esc(f.id)}" placeholder="Why ignore this one? Enter saves"></div>` : ''}
    </div>
    <div class="acts">${d
      ? `<button class="sm" data-iact="reopen" data-id="${esc(f.id)}">Undo</button>`
      : `<button class="bad sm" data-iact="confirm" data-id="${esc(f.id)}">Confirm</button><button class="ok sm" data-iact="reject" data-id="${esc(f.id)}">Ignore</button><button class="warn sm" data-iact="look" data-id="${esc(f.id)}">Not sure</button>`}
      <button class="sm" data-iview="${esc(f.id)}">View</button></div>
  </div>`;
}

// ---- decisions ------------------------------------------------------------------

function flash(msg, ms = 1600) { const el = $('#flash'); el.textContent = msg; el.classList.add('show'); clearTimeout(flash.t); flash.t = setTimeout(() => el.classList.remove('show'), ms); }
async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) { flash(j.error || 'not saved', 2500); return null; }
  return j;
}

async function decide(ids, verdict, gid, reason, singleId) {
  if (!ids.length) return;
  if (verdict === 'reopen') ids = gid ? S.groupById[gid].ids : ids;
  if (reason == null) {
    const inp = gid ? $(`[data-greason="${CSS.escape(gid)}"]`) : singleId ? $(`[data-ireason="${CSS.escape(singleId)}"]`) : null;
    reason = inp ? inp.value.trim() : '';
    if (verdict === 'reject' && !reason) {
      if (inp) { inp.closest('.reasonrow') && (inp.closest('.reasonrow').hidden = false); inp.dataset.pending = 'reject'; inp.placeholder = 'Why is this not a problem? Enter saves.'; inp.focus(); return; }
      reason = window.prompt('Why is this not a problem?') || '';
      if (!reason.trim()) return;
    }
  }
  if (verdict === 'reject' && !reason.trim()) { flash('Ignoring needs a reason', 2200); return; }
  const ok = await post('/api/decision', { ids, verdict, reason: reason || '', group: gid || undefined });
  if (!ok) return;
  await loadSite(S.site);
  if (verdict === 'reopen') { flash('Undone'); return; }
  const ps = ids.map((id) => S.proposals[id]).filter((p) => p && p.verdict);
  const agree = ps.filter((p) => MODEL_TO_HUMAN[p.verdict] === verdict).length;
  flash(`${LABEL[verdict]} ${ids.length}${ps.length ? ` · AI agreed on ${agree}/${ps.length}` : ''}`, 2400);
  if ($('#viewer').classList.contains('show')) { V.list = V.list.map((id) => id); showViewerItem(); }
}

// ---- worksheet tab -------------------------------------------------------------

function suggest(c) {
  const ids = S.groups.filter((g) => g.criterion === c.id).flatMap((g) => g.ids);
  if (!ids.length) return null;
  const t = tally(ids);
  if (t.todo === ids.length) return null;
  if (t.confirm) return { status: 'Does Not Support', why: `${t.confirm} confirmed` };
  if (t.look) return { status: 'Not Evaluated', why: `${t.look} not sure` };
  return { status: 'Supports', why: `all ${t.reject} ignored` };
}

function renderWorksheet() {
  const rows = S.wcag.criteria.filter((c) => c.level !== 'AAA' && c.id !== 'best-practice');
  let html = `<p class="sub">The Review sheet from the template: a status and a note per criterion. Where you've reviewed the flagged items a status is suggested, and the export uses the suggestion wherever you haven't set one yourself. Confirmed items become Task List rows automatically. Saves as you go.</p>
  <table class="ws"><thead><tr><th>Level</th><th>Criterion</th><th>Evidence</th><th>Status</th><th>Notes</th></tr></thead><tbody>`;
  let lastG = null;
  for (const c of rows) {
    if (c.guideline !== lastG) { html += `<tr><td colspan="5" style="background:var(--panel);font-weight:600">${esc(c.guideline)}</td></tr>`; lastG = c.guideline; }
    const rec = S.criteria[c.id] || {};
    const ids = S.groups.filter((g) => g.criterion === c.id).flatMap((g) => g.ids);
    const sg = suggest(c);
    html += `<tr data-c="${esc(c.id)}"><td class="sub">${esc(c.level)}</td>
      <td><b>${esc(c.id)}</b> ${esc(c.name)}${c.link ? ` <a href="${esc(c.link)}" target="_blank" rel="noopener" title="Understanding">↗</a>` : ''}</td>
      <td class="sub">${ids.length ? `${ids.length} flagged` : '—'}</td>
      <td class="status"><select data-cs="${esc(c.id)}">${S.wcag.statuses.map((s) => `<option ${s === (rec.status || 'Not Evaluated') ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
        ${sg && sg.status !== (rec.status || 'Not Evaluated') ? `<div class="sug">suggested: <b data-sug="${esc(c.id)}" data-status="${esc(sg.status)}">${esc(sg.status)}</b> (${esc(sg.why)})</div>` : ''}</td>
      <td><textarea data-cn="${esc(c.id)}" placeholder="${esc(c.canned || '')}">${esc(rec.notes || '')}</textarea></td></tr>`;
  }
  html += `</tbody></table>`;
  $('#worksheet').innerHTML = html;
  $('#worksheet').querySelectorAll('[data-cs]').forEach((s) => s.onchange = () => saveCriterion(s.dataset.cs, s.value, $(`[data-cn="${CSS.escape(s.dataset.cs)}"]`).value));
  $('#worksheet').querySelectorAll('[data-cn]').forEach((t) => t.onblur = () => saveCriterion(t.dataset.cn, $(`[data-cs="${CSS.escape(t.dataset.cn)}"]`).value, t.value));
  $('#worksheet').querySelectorAll('[data-sug]').forEach((b) => b.onclick = () => saveCriterion(b.dataset.sug, b.dataset.status, $(`[data-cn="${CSS.escape(b.dataset.sug)}"]`).value, true));
}

async function saveCriterion(id, status, notes, rerender) {
  const cur = S.criteria[id] || {};
  if ((cur.status || 'Not Evaluated') === status && (cur.notes || '').trim() === notes.trim()) return;
  const r = await post('/api/criterion', { site: S.site, criterion: id, status, notes });
  if (!r) return;
  S.criteria[id] = r;
  flash(`${id}: ${status}`);
  if (rerender) renderWorksheet();
}

// ---- view on page ---------------------------------------------------------------

function openViewer(gid, singleId) {
  V.list = gid ? S.groupById[gid].ids.filter((id) => S.byId[id].box) : singleId ? [singleId] : [];
  V.gid = gid || (singleId ? S.groups.find((g) => g.ids.includes(singleId)).id : null);
  if (!V.list.length) { flash('None of these have a position on the screenshot'); return; }
  V.i = 0;
  $('#viewer').classList.add('show');
  const stage = $('#stage');
  const src = `/screens/${encodeURIComponent(S.shot)}`;
  let img = stage.querySelector('img');
  if (!img || img.dataset.src !== src) {
    stage.innerHTML = `<img src="${src}" data-src="${src}" alt=""><canvas></canvas>`;
    img = stage.querySelector('img');
    img.onload = () => { const cv = stage.querySelector('canvas'); cv.width = img.naturalWidth; cv.height = img.naturalHeight; cv.getContext('2d').drawImage(img, 0, 0); layoutViewer(); showViewerItem(); };
  } else { layoutViewer(); showViewerItem(); }
}

function layoutViewer() {
  const stage = $('#stage'), img = stage.querySelector('img'), body = $('#vbody');
  const pageW = (S.viewport && S.viewport.width) || img.naturalWidth;
  V.scale = Math.min(1, (body.clientWidth - 40) / pageW);
  stage.style.transform = `scale(${V.scale})`;
  stage.style.width = pageW + 'px';
  stage.style.height = img.naturalHeight + 'px';
  stage.style.marginBottom = `-${img.naturalHeight * (1 - V.scale)}px`;
  stage.style.marginLeft = `${Math.max(0, (body.clientWidth - pageW * V.scale) / 2)}px`;
}

function showViewerItem() {
  const stage = $('#stage');
  stage.querySelectorAll('.hl, .ghost, .mark').forEach((e) => e.remove());
  const id = V.list[V.i], f = S.byId[id], b = f.box, d = dec(id), p = S.proposals[id], m = p && p.measured;
  // the current one, spotlighted; the rest of the group as clickable outlines
  for (const oid of (V.gid ? S.groupById[V.gid].ids : [])) {
    if (oid === id || !S.byId[oid].box) continue;
    const ob = S.byId[oid].box, g = document.createElement('div');
    g.className = 'ghost'; g.style.left = ob.x + 'px'; g.style.top = ob.y + 'px'; g.style.width = Math.max(6, ob.w) + 'px'; g.style.height = Math.max(6, ob.h) + 'px';
    g.onclick = () => { const i = V.list.indexOf(oid); if (i >= 0) { V.i = i; showViewerItem(); } };
    stage.appendChild(g);
  }
  const hl = document.createElement('div');
  hl.className = 'hl'; hl.style.left = (b.x - 4) + 'px'; hl.style.top = (b.y - 4) + 'px'; hl.style.width = (Math.max(6, b.w) + 8) + 'px'; hl.style.height = (Math.max(6, b.h) + 8) + 'px';
  stage.appendChild(hl);
  const body = $('#vbody');
  body.scrollTo({ top: Math.max(0, (b.y + b.h / 2) * V.scale - body.clientHeight / 2 + 40), behavior: 'smooth' });
  const g = S.groupById[V.gid];
  $('#v-info').innerHTML = `<b>${V.i + 1} / ${V.list.length}</b> · ${esc(g ? g.help : f.help)} · “${esc(b.text || f.target)}”${m && m.ok && m.fg ? ` · <b class="${m.ratio >= m.threshold ? 'pass' : 'fail'}">${m.ratio}:1</b>${m.best && m.best !== m.ratio ? `–${m.best}:1` : ''} <span class="sub">needs ${m.threshold}:1</span>` : ''}${d ? ` · <b>${LABEL[d.verdict]}</b>${d.reason ? ' — ' + esc(d.reason) : ''}` : ''}`;
  $('#v-confirm').disabled = $('#v-ignore').disabled = $('#v-look').disabled = !!d;
}

function closeViewer() { $('#viewer').classList.remove('show'); setDropper(false); }
function stepViewer(n) { if (!V.list.length) return; V.i = (V.i + n + V.list.length) % V.list.length; showViewerItem(); }

// eyedropper inside the viewer
function lum([r, g, b]) { const f = (c) => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }; return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b); }
function ratio(a, b) { const la = lum(a), lb = lum(b); return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05); }
const hex = (c) => '#' + c.map((v) => v.toString(16).padStart(2, '0')).join('');
function setDropper(on) {
  V.dropper = on; V.a = null;
  $('#vbody').classList.toggle('dropper', on);
  $('#v-drop').classList.toggle('primary', on);
  $('#stage').querySelectorAll('.mark').forEach((m) => m.remove());
  const ro = $('#readout'); ro.classList.toggle('show', on);
  if (on) ro.innerHTML = `<b>Eyedropper.</b> Click the text, then click the background behind it — try the lightest and the darkest spot.`;
}
$('#stage').addEventListener('click', (e) => {
  if (!V.dropper) return;
  const cv = $('#stage').querySelector('canvas'); if (!cv) return;
  const r = $('#stage').getBoundingClientRect();
  const x = Math.round((e.clientX - r.left) / V.scale), y = Math.round((e.clientY - r.top) / V.scale);
  const d = cv.getContext('2d').getImageData(x, y, 1, 1).data, c = [d[0], d[1], d[2]];
  const mark = document.createElement('div'); mark.className = 'mark'; mark.style.left = x + 'px'; mark.style.top = y + 'px'; mark.style.background = hex(c); $('#stage').appendChild(mark);
  const ro = $('#readout');
  if (!V.a) { V.a = c; ro.innerHTML = `<span class="sw" style="background:${hex(c)}"></span>${hex(c)} — now click the background.`; return; }
  const rt = ratio(V.a, c);
  ro.innerHTML = `<span class="big ${rt >= 4.5 ? 'pass' : 'fail'}">${rt.toFixed(2)}:1</span> &nbsp;<span class="sw" style="background:${hex(V.a)}"></span>${hex(V.a)} on <span class="sw" style="background:${hex(c)}"></span>${hex(c)} &nbsp;<span class="sub">${rt >= 4.5 ? 'passes for any text' : rt >= 3 ? 'large text only (24px, or 18.66px bold)' : 'fails'}</span> &nbsp;<button class="sm" id="ro-again">Again</button>`;
  $('#ro-again').onclick = () => setDropper(true);
  V.a = null;
});

$('#v-prev').onclick = () => stepViewer(-1);
$('#v-next').onclick = () => stepViewer(1);
$('#v-close').onclick = closeViewer;
$('#v-drop').onclick = () => setDropper(!V.dropper);
$('#v-confirm').onclick = () => decide([V.list[V.i]], 'confirm');
$('#v-look').onclick = () => decide([V.list[V.i]], 'look');
$('#v-ignore').onclick = () => { const reason = window.prompt('Why is this not a problem?') || ''; if (reason.trim()) decide([V.list[V.i]], 'reject', null, reason); };
window.addEventListener('resize', () => { if ($('#viewer').classList.contains('show')) { layoutViewer(); showViewerItem(); } });

// ---- wiring ------------------------------------------------------------------------

$('#site').onchange = () => { open = new Set(); $('#site').value ? loadSite($('#site').value) : renderOverview(); };
function applyTheme(t) {
  if (t === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  document.querySelectorAll('#theme button').forEach((b) => b.classList.toggle('on', b.dataset.theme === t));
  try { localStorage.setItem('sp-theme', t); } catch {}
}
document.querySelectorAll('#theme button').forEach((b) => b.onclick = () => applyTheme(b.dataset.theme));
let savedTheme = 'system'; try { savedTheme = localStorage.getItem('sp-theme') || 'system'; } catch {}
applyTheme(savedTheme);
document.querySelectorAll('.tabs button').forEach((b) => b.onclick = () => { tab = b.dataset.tab; render(); });
$('#export').onclick = () => { if (!S) return; window.open(`/api/export?site=${encodeURIComponent(S.site)}`, '_blank'); flash('Building the worksheet…', 2500); };
document.addEventListener('keydown', (e) => {
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') { if (e.key === 'Escape') e.target.blur(); return; }
  if (!$('#viewer').classList.contains('show')) return;
  if (e.key === 'Escape') closeViewer();
  else if (e.key === 'ArrowRight') stepViewer(1);
  else if (e.key === 'ArrowLeft') stepViewer(-1);
  else if (e.key.toLowerCase() === 'e') setDropper(!V.dropper);
  else if (e.key.toLowerCase() === 'c') $('#v-confirm').click();
  else if (e.key.toLowerCase() === 'i') $('#v-ignore').click();
  else if (e.key.toLowerCase() === 'n') $('#v-look').click();
  else return;
  e.preventDefault();
});

loadSites();
</script>
